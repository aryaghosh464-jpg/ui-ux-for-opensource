<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>ContribLens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2322c55e'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== FORCE BLACK ===== */
html,body{background:#000000!important;color:#22c55e}

/* ===== TOKENS (ALL GREEN ACCENTS) ===== */
:root{
  --bg:#000000;
  --text:#4ade80;
  --text-dim:#22c55e;
  --muted:#16a34a;
  --border:rgba(34,197,94,0.35);
  --border-soft:rgba(34,197,94,0.2);
  --btn-h:44px;
  --hero-btn-h:48px;
  --btn-font:15px;
}

/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{
  background:#000000;color:var(--text,#4ade80);
  width:100%;height:100%;overflow:hidden;
  font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer}

/* ===== GRAIN OVERLAY ===== */
.grain{
  position:fixed;inset:0;z-index:100;pointer-events:none;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
}

/* ===== HERO GREEN WAVE BACKGROUND ===== */
.hero-photo{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  animation:in-photo 1.6s cubic-bezier(.16,1,.3,1) .1s both;
}
.hero-photo video{
  width:100%;height:100%;object-fit:cover;
  /* Transform monochrome wave into radiant emerald green */
  filter:sepia(100%) saturate(600%) hue-rotate(85deg) brightness(0.95);
}
.hero-photo::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(34,197,94,0.12) 0%, rgba(0,0,0,0.65) 85%);
}

/* ===== FULL VIEWPORT CONTAINER ===== */
.page{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;width:100%;
  padding:24px;text-align:center;
}

/* ===== HEADLINE ===== */
.headline{
  font-size:clamp(52px, 8vw, 92px);
  font-weight:700;
  letter-spacing:-0.04em;
  line-height:1.05;
  color:#ffffff;
  text-shadow:0 0 40px rgba(255,255,255,0.3), 0 0 80px rgba(34,197,94,0.25);
  margin-bottom:32px;
  user-select:none;
}

/* ===== BUTTONS CONTAINER ===== */
.hero-actions{
  display:flex;align-items:center;justify-content:center;
  gap:16px;flex-wrap:wrap;max-width:800px;
}

/* ===== LIQUID-GLASS BUTTONS ===== */
.btn{
  position:relative;isolation:isolate;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;
  height:var(--hero-btn-h);padding:0 24px;border-radius:8px;
  font-size:var(--btn-font);font-weight:600;letter-spacing:-0.02em;line-height:1;white-space:nowrap;cursor:pointer;
  transition:all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,0.5) 48%,transparent 76%);
  transform:translateX(-130%);transition:transform .65s ease;pointer-events:none;
}
.btn:hover::after{transform:translateX(130%)}

/* -- Solid White Button (Sign In) -- */
.btn-solid{
  background:linear-gradient(180deg,#ffffff 0%,#eaeaea 48%,#d4d4d4 100%);
  color:#111111;
  border:1px solid #ffffff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), 0 0 24px rgba(255,255,255,0.3), 0 8px 20px rgba(0,0,0,0.4);
}
.btn-solid:hover{
  background:linear-gradient(180deg,#ffffff 0%,#f5f5f5 48%,#e0e0e0 100%);
  border-color:#ffffff;
  box-shadow:inset 0 1px 0 #fff, 0 0 36px rgba(255,255,255,0.55), 0 10px 24px rgba(255,255,255,0.25);
  transform:translateY(-1px);
}

/* -- Frosted Ghost White Buttons (Open Source Check & Product Health Check) -- */
.btn-ghost{
  background:linear-gradient(135deg,rgba(255,255,255,0.12),rgba(0,0,0,0.55) 46%,rgba(255,255,255,0.08));
  color:#ffffff;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 0 18px rgba(255,255,255,0.12);
}
.btn-ghost:hover{
  background:linear-gradient(135deg,rgba(255,255,255,0.22),rgba(0,0,0,0.4) 48%,rgba(255,255,255,0.16));
  border-color:rgba(255,255,255,0.9);
  color:#ffffff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), 0 0 28px rgba(255,255,255,0.35);
  transform:translateY(-1px);
}

/* ===== ANIMATIONS ===== */
@keyframes in-photo{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes in-scale{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes in-soft{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.appear{
  opacity:1;
  animation-duration:1.1s;animation-fill-mode:both;
  animation-timing-function:cubic-bezier(.16,1,.3,1);
  animation-delay:var(--d,.08s);
}
.appear--scale{animation-name:in-scale}
.appear--soft{animation-name:in-soft}

.is-in{animation:none!important;opacity:1!important;transform:none!important}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .appear,.hero-photo{opacity:1;transform:none}
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .headline{font-size:46px;margin-bottom:24px}
  .hero-actions{flex-direction:column;width:100%;gap:12px}
  .hero-actions .btn{width:100%}
}
</style>
</head>
<body style="background:#000;color:#22c55e">

<!-- GRAIN OVERLAY -->
<div class="grain"></div>

<!-- HERO GREEN WAVE VIDEO BACKGROUND -->
<div class="hero-photo">
  <video autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260818_072341_50851634-bbc3-4c33-9acc-7647d4db44aa.mp4" type="video/mp4">
  </video>
</div>

<!-- PAGE CONTENT -->
<main class="page">
  <!-- HEADLINE -->
  <h1 class="headline appear appear--scale" style="--d:0.12s">
    ContribLens
  </h1>

  <!-- THREE BUTTON OPTIONS -->
  <div class="hero-actions appear appear--soft" style="--d:0.32s">
    <a class="btn btn-solid" href="#signin">Sign In</a>
    <a class="btn btn-ghost" href="#opensource-check">Open Source Check</a>
    <a class="btn btn-ghost" href="#health-check">Product Health Check</a>
  </div>
</main>

<script>
(function(){
  'use strict';
  var appears = document.querySelectorAll('.appear');
  var heroPhoto = document.querySelector('.hero-photo');
  function markIn(el){ el.classList.add('is-in'); }
  appears.forEach(function(el){
    el.addEventListener('animationend', function(){ markIn(el); }, {once:true});
  });
  if(heroPhoto){
    heroPhoto.addEventListener('animationend', function(){ markIn(heroPhoto); }, {once:true});
  }
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      appears.forEach(function(el){
        var a = el.getAnimations ? el.getAnimations() : [];
        if(!a.some(function(x){ return x.playState==='running' || x.playState==='finished'; })) markIn(el);
      });
      if(heroPhoto){
        var pa = heroPhoto.getAnimations ? heroPhoto.getAnimations() : [];
        if(!pa.some(function(x){ return x.playState==='running' || x.playState==='finished'; })) markIn(heroPhoto);
      }
    });
  });
})();
</script>
</body>
</html>
